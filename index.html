<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Rasa | Jurnal Pribadi</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Form Input */
    .form-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    input, textarea, select {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    /* List Cerita */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .entry-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      position: relative;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .mood-tag {
      font-size: 0.8rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 500;
    }

    .entry-date {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .entry-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .entry-body {
      color: #cbd5e1;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .btn-del {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 10px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Ruang Rasa</h1>
      <p>Tempat gue menaruh segala isi kepala dan apa yang lagi dirasain.</p>
    </header>

    <!-- Form Buat Nulis -->
    <div class="form-box">
      <div class="form-group">
        <select id="mood">
          <option value="🌿 Reflektif">🌿 Reflektif</option>
          <option value="🌪️ Overthinking">🌪️ Overthinking</option>
          <option value="☕ Santai">☕ Santai</option>
          <option value="⚡ Bersemangat">⚡ Bersemangat</option>
          <option value="🌧️ Lelah / Sedih">🌧️ Lelah / Sedih</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="title" placeholder="Judul tulisan atau rangkuman harimu..." required />
      </div>
      <div class="form-group">
        <textarea id="content" placeholder="Ceritain apa aja di sini tanpa perlu khawatir dihakimi..." required></textarea>
      </div>
      <button class="btn-submit" onclick="saveEntry()">Simpan Cerita</button>
    </div>

    <!-- Feed Cerita -->
    <div class="timeline" id="timeline"></div>
  </div>

  <script>
    // Ambil data dari LocalStorage
    function getEntries() {
      return JSON.parse(localStorage.getItem('my_journal_entries')) || [];
    }

    function renderEntries() {
      const timeline = document.getElementById('timeline');
      const entries = getEntries();

      if (entries.length === 0) {
        timeline.innerHTML = `<p style="text-align:center; color: var(--muted);">Belum ada cerita yang ditulis. Mulai tuangkan perasaanmu di atas.</p>`;
        return;
      }

      timeline.innerHTML = entries.map((item, index) => `
        <article class="entry-card">
          <div class="entry-header">
            <span class="mood-tag">${item.mood}</span>
            <span class="entry-date">${item.date}</span>
          </div>
          <h2 class="entry-title">${item.title}</h2>
          <p class="entry-body">${item.content}</p>
          <button class="btn-del" onclick="deleteEntry(${index})">Hapus</button>
        </article>
      `).join('');
    }

    function saveEntry() {
      const mood = document.getElementById('mood').value;
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !content) {
        alert('Harap isi judul dan cerita lo dulu ya.');
        return;
      }

      const now = new Date();
      const formattedDate = now.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      const newEntry = { mood, title, content, date: formattedDate };
      const entries = getEntries();
      entries.unshift(newEntry); // Taruh yang terbaru di paling atas

      localStorage.setItem('my_journal_entries', JSON.stringify(entries));

      // Reset form
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';

      renderEntries();
    }

    function deleteEntry(index) {
      if (confirm('Yakin mau hapus cerita ini?')) {
        const entries = getEntries();
        entries.splice(index, 1);
        localStorage.setItem('my_journal_entries', JSON.stringify(entries));
        renderEntries();
      }
    }

    // Load awal
    renderEntries();
  </script>
</body>
</html>
