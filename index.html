<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerita Senja | Ruang Tenang</title>
  <style>
    :root {
      --bg-overcast: #1e293b;
      --bg-card: #334155;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-warm: #fcd5b5;
      --accent-dusty: #e2a89c;
      --border: #475569;
      --shadow-cozy: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --font-body: 'Georgia', serif;
      --font-heading: 'Helvetica Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-overcast);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.85;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(at 10% 10%, rgba(51, 65, 85, 0.35) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(15, 23, 42, 0.25) 0px, transparent 50%);
      padding: 40px 20px 80px;
    }

    .container { width: 100%; max-width: 680px; }

    header { text-align: center; margin-bottom: 3.5rem; }
    header h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent-warm);
      margin-bottom: 6px;
    }
    header p { font-size: 1rem; color: var(--text-muted); font-style: italic; }

    /* Tombol Tulis */
    .btn-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: var(--accent-dusty);
      color: #1e293b;
      font-family: var(--font-heading);
      font-weight: 600;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(226, 168, 156, 0.4);
      z-index: 10;
      transition: transform 0.2s ease;
    }
    .btn-float:hover { transform: translateY(-2px); }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal.active { display: flex; }

    .form-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 500px;
      box-shadow: var(--shadow-cozy);
    }
    .form-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .form-header h2 { font-family: var(--font-heading); font-size: 1.3rem; color: var(--accent-warm); }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    input, textarea, select {
      width: 100%;
      background: #19212c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1rem;
      outline: none;
    }
    textarea { resize: vertical; min-height: 150px; }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-warm);
      color: #1e293b;
      font-family: var(--font-heading);
      font-weight: 600;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; }

    /* Cards */
    .timeline { display: flex; flex-direction: column; gap: 24px; }
    .entry-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px 24px;
      box-shadow: var(--shadow-cozy);
    }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(71, 85, 105, 0.6);
      padding-bottom: 8px;
    }
    .mood-tag {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      background: rgba(226, 168, 156, 0.15);
      color: var(--accent-dusty);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 500;
    }
    .entry-date { font-size: 0.8rem; color: var(--text-muted); font-family: var(--font-heading); }
    .entry-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.8rem;
    }

    /* Style Potongan Teks & Read More */
    .entry-body {
      color: #cbd5e1;
      white-space: pre-wrap;
      font-size: 1.05rem;
      position: relative;
    }

    .entry-body.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-read-more {
      background: none;
      border: none;
      color: var(--accent-warm);
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      padding: 0;
      display: inline-block;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .btn-read-more:hover { color: var(--accent-dusty); }

    footer {
      text-align: center;
      margin-top: 4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-family: var(--font-heading);
    }
  </style>

  <!-- Firebase Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdvt71KQZOike1u91NkntzyuLVhQ1U9xw",
      authDomain: "cerita-senja.firebaseapp.com",
      projectId: "cerita-senja",
      storageBucket: "cerita-senja.firebasestorage.app",
      messagingSenderId: "947576459982",
      appId: "1:947576459982:web:0c773e833409de9c0f769f",
      measurementId: "G-G34FPRCYFM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const SECRET_PIN = "1234";

    window.openModal = function() {
      const pin = prompt("Masukkan PIN Pemilik untuk menulis:");
      if (pin === SECRET_PIN) {
        document.getElementById('entryModal').classList.add('active');
      } else if (pin !== null) {
        alert("PIN salah. Akses ditolak.");
      }
    };

    window.closeModal = function() {
      document.getElementById('entryModal').classList.remove('active');
    };

    window.saveStory = async function() {
      const mood = document.getElementById('mood').value;
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !content) {
        alert("Judul dan isi cerita wajib diisi.");
        return;
      }

      const btn = document.querySelector('.btn-submit');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      try {
        await addDoc(collection(db, "stories"), {
          mood: mood,
          title: title,
          content: content,
          createdAt: serverTimestamp(),
          dateString: new Date().toLocaleDateString('id-ID', {
            day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
          })
        });

        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        closeModal();
        loadStories();
      } catch (err) {
        alert("Gagal simpan: " + err.message);
      } finally {
        btn.innerText = "Simpan di Ruang Tenang";
        btn.disabled = false;
      }
    };

    window.toggleReadMore = function(id) {
      const body = document.getElementById(`body-${id}`);
      const btn = document.getElementById(`btn-${id}`);
      if (body.classList.contains('truncated')) {
        body.classList.remove('truncated');
        btn.innerText = "Tutup tulisan ↑";
      } else {
        body.classList.add('truncated');
        btn.innerText = "Baca selengkapnya...";
      }
    };

    async function loadStories() {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 40px;">Memuat tulisan dari senja...</p>`;

      try {
        const q = query(collection(db, "stories"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          timeline.innerHTML = `
            <div style="text-align:center; padding: 40px; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 16px;">
              <p>Belum ada cerita yang tertuang di database.</p>
              <p style="font-size: 0.9rem; margin-top: 6px;">Klik <strong>+ Tulis</strong> di pojok kanan bawah untuk mulai.</p>
            </div>`;
          return;
        }

        let html = '';
        let index = 0;
        querySnapshot.forEach((doc) => {
          const item = doc.data();
          const isLong = (item.content || '').length > 180 || (item.content || '').includes('\n\n');
          
          html += `
            <article class="entry-card">
              <div class="entry-header">
                <span class="mood-tag">${item.mood || '🌿 Reflektif'}</span>
                <span class="entry-date">${item.dateString || ''}</span>
              </div>
              <h2 class="entry-title">${item.title}</h2>
              <p class="entry-body ${isLong ? 'truncated' : ''}" id="body-${index}">${item.content}</p>
              ${isLong ? `<button class="btn-read-more" id="btn-${index}" onclick="toggleReadMore(${index})">Baca selengkapnya...</button>` : ''}
            </article>
          `;
          index++;
        });
        timeline.innerHTML = html;
      } catch (err) {
        timeline.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Gagal memuat tulisan.</p>`;
      }
    }

    window.onload = loadStories;
  </script>
</head>
<body>

  <div class="modal" id="entryModal">
    <div class="form-box">
      <div class="form-header">
        <h2>Tuangkan Pikiran</h2>
        <button class="btn-close" onclick="closeModal()">×</button>
      </div>
      <div class="form-group">
        <select id="mood">
          <option value="🌪️ Overthinking">🌪️ Overthinking</option>
          <option value="🌧️ Mendung/Reflektif">🌧️ Mendung/Reflektif</option>
          <option value="☕ Santai/Cozy">☕ Santai/Cozy</option>
          <option value="⚡ Bersemangat">⚡ Bersemangat</option>
          <option value="🥀 Lelah/Sedih">🥀 Lelah/Sedih</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" id="title" placeholder="Judul ceritamu..." required />
      </div>
      <div class="form-group">
        <textarea id="content" placeholder="Ceritain apa aja di sini..." required></textarea>
      </div>
      <button class="btn-submit" onclick="saveStory()">Simpan di Ruang Tenang</button>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>Cerita Senja</h1>
      <p>Ruang tenang untuk menaruh segala isi kepala di pengujung hari.</p>
    </header>

    <button class="btn-float" onclick="openModal()">+ Tulis</button>
    <div class="timeline" id="timeline"></div>

    <footer>
      © Cerita Senja — Ditulis apa adanya.
    </footer>
  </div>

</body>
</html>
